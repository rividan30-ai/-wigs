<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Special Wigs – Right to You | ספיישל ויגס עד אליך</title>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700;900&family=Heebo:wght@200;300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f0ea;--card:#fcfaf7;--ink:#1d1613;--mute:#7b6f66;--gold:#b08d4a;--gold2:#dcc7a1;--line:#e5dbcf;--dark:#1a1311;--darktx:#f7efe6;--soft:#ebe3d9;--wine:#6e1f2f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141010;--card:#1d1715;--ink:#f4ece3;--mute:#b5a89c;--line:#33292a;--dark:#0b0808;--soft:#221a19}}
:root[data-theme="dark"]{--bg:#141010;--card:#1d1715;--ink:#f4ece3;--mute:#b5a89c;--line:#33292a;--dark:#0b0808;--soft:#221a19}
*{box-sizing:border-box;margin:0}html{scroll-behavior:smooth;scroll-padding-top:84px}
body{background:var(--bg);color:var(--ink);font-family:'Heebo',sans-serif;line-height:1.8;font-weight:300;overflow-x:hidden}
h1,h2,h3{font-family:'Frank Ruhl Libre',serif;font-weight:400;line-height:1.3}a{color:inherit;text-decoration:none}
.wrap{max-width:1120px;margin:auto;padding:0 24px}
header{position:sticky;top:12px;z-index:20;margin:12px 16px 0}
.nav{display:flex;align-items:center;justify-content:space-between;height:64px;background:color-mix(in srgb,var(--card) 82%,transparent);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:999px;padding:0 26px;max-width:1120px;margin:auto;box-shadow:0 10px 40px -24px rgba(120,80,40,.45)}
.logo{font-family:'Frank Ruhl Libre',serif;font-size:21px;font-weight:700}.logo b{color:var(--gold);font-weight:400;font-style:italic}.logo small{display:block;font:400 10px Heebo;letter-spacing:1.4px;color:var(--mute);margin-top:-5px}
nav{display:flex;gap:22px;font-size:13px}nav a{color:var(--mute);transition:.25s}nav a:hover{color:var(--gold)}
.btn{display:inline-block;padding:13px 30px;border:1px solid var(--gold);border-radius:999px;font-size:14px;font-weight:400;cursor:pointer;background:linear-gradient(120deg,#d6456f,#a82f66);color:#fff;transition:.3s;font-family:inherit}
.btn:hover{background:transparent!important;color:var(--gold);transform:translateY(-2px)}.btn.o{background:transparent;color:var(--gold)}.btn.o:hover{background:var(--gold);color:#fff}
.hero{margin-top:-76px;padding:170px 0 140px;background:radial-gradient(55% 60% at 88% 8%,#e0467a 0,transparent 62%),radial-gradient(45% 55% at 8% 95%,#f2a35e 0,transparent 60%),linear-gradient(155deg,#3a1347,#220b2c 70%);color:var(--darktx);position:relative;overflow:hidden;border-radius:0 0 50% 50%/0 0 100px 100px}
.hero:before,.hero:after{content:"";position:absolute;border-radius:50%;filter:blur(2px);animation:fl 12s ease-in-out infinite}
.hero:before{width:380px;height:380px;left:-90px;top:90px;background:radial-gradient(circle at 30% 30%,rgba(232,207,180,.28),transparent 70%)}
.hero:after{width:260px;height:260px;left:30%;bottom:-70px;background:radial-gradient(circle,rgba(224,70,122,.4),transparent 70%);animation-delay:-5s}
@keyframes fl{50%{transform:translateY(-26px) scale(1.06)}}
.hero .wrap{position:relative;z-index:1}
.eyebrow{font-size:12px;letter-spacing:3px;color:var(--gold2);margin-bottom:18px}
.hero h1{font-size:clamp(38px,6vw,68px);max-width:740px;font-weight:500}.hero h1 em{font-style:italic;color:var(--gold2)}
.hero p{max-width:540px;margin:22px 0 34px;color:#e3d3c3;font-size:17px}
.hero .btn.o{color:var(--gold2);border-color:var(--gold2);margin-right:10px}.hero .btn.o:hover{background:var(--gold2);color:#2b1f1b}
.stats{display:flex;gap:18px;margin-top:56px;flex-wrap:wrap}.stats div{background:rgba(255,255,255,.07);border:1px solid rgba(232,207,180,.22);border-radius:26px;padding:14px 26px;backdrop-filter:blur(8px)}.stats b{display:block;font-family:'Frank Ruhl Libre',serif;font-size:28px;color:var(--gold2);font-weight:400}.stats span{font-size:12px;color:#d1c0ae}
section{padding:100px 0}.alt{background:var(--soft);border-radius:56px;margin:0 12px}
.head{max-width:640px;margin-bottom:50px}.head .eyebrow{color:var(--gold)}.head h2{font-size:clamp(28px,4vw,42px)}.head p{color:var(--mute);margin-top:14px}
.grid{display:grid;gap:24px}.g3{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
